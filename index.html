<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoSpace</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>

  <link rel="stylesheet" href="css/geral.css">
  <link rel="stylesheet" href="css/galleryForms.css">
  <link rel="stylesheet" href="css/baseForms.css">
</head>
<body>

  <div id="dashboardView" class="view-active">
    <header class="main-header">
      <div class="header-container">
        <h1>GeoSpace <span class="logo-dot">.</span></h1>
        <p class="subtitle">Laboratório Interativo de Sólidos Geométricos</p>
      </div>
    </header>

    <main class="wrap">
      <div class="grid" id="grid"></div>
    </main>
  </div>

  <div id="viewerView" class="view-hidden">
    <button id="btnBack" class="btn-back" aria-label="Voltar para a Galeria">
      <i class="icon-spacing" data-lucide="arrow-left"></i> Voltar
    </button>

    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="title-with-icon">
          <i id="solidTitleIcon" class="icon-spacing text-accent"></i>
          <h2 id="solidTitle">Cubo</h2>
        </div>
        <span class="badge">Sólido 3D</span>
      </div>

      <div class="sidebar-content">
        <section class="control-group">
          <h3><i class="icon-spacing" data-lucide="sliders"></i> Dimensões</h3>
          <div id="dynamicInputs" class="inputs-container"></div>
        </section>

        <section class="control-group">
          <h3><i class="icon-spacing" data-lucide="palette"></i> Customização</h3>
          
          <div class="input-field">
            <label for="zoom">Zoom da Câmera</label>
            <input id="zoom" type="range" min="4" max="40" step="0.1" value="12">
          </div>

          <div class="input-field">
            <label for="faceAlpha">Opacidade do Sólido</label>
            <input id="faceAlpha" type="range" min="0.00" max="1" step="0.05" value="0.25">
          </div>

          <div class="color-grid">
            <div class="color-field">
              <label for="faceColor">Sólido</label>
              <div class="color-picker-wrapper">
                <input id="faceColor" type="color" value="#3b82f6">
              </div>
            </div>

            <div class="color-field">
              <label for="edgeColor">Arestas</label>
              <div class="color-picker-wrapper">
                <input id="edgeColor" type="color" value="#64748b">
              </div>
            </div>

            <div class="color-field">
              <label for="labelColor">Medidas</label>
              <div class="color-picker-wrapper">
                <input id="labelColor" type="color" value="#f59e0b">
              </div>
            </div>

            <div class="color-field">
              <label for="bgColor">Fundo</label>
              <div class="color-picker-wrapper">
                <input id="bgColor" type="color" value="#0f172a">
              </div>
            </div>
          </div>
        </section>

        <section class="control-group output-group">
          <h3><i class="icon-spacing" data-lucide="binary"></i> Resultados</h3>
          <div id="volume" class="math-outputs"></div>
        </section>
      </div>
    </aside>

    <main class="canvas-container">
      <canvas id="renderCanvas"></canvas>
    </main>
  </div>

  <footer class="global-footer">
    <p>&copy; Todos os direitos reservados a Arichel dos Santos Moron</p>
  </footer>

  <template id="cardTpl">
    <div class="card" role="button" tabindex="0">
      <div class="card-ui-box">
        <div class="card-visual-preview">
          <i class="preview-icon" data-lucide="box"></i>
        </div>
        <div class="card-info">
          <span class="card-category">Geometria Espacial</span>
          <h2 class="title"></h2>
        </div>
        <div class="card-action">
          <i class="icon" data-lucide="chevron-right"></i>
        </div>
      </div>
    </div>
  </template>

  <script src="js/geral.js"></script>
  <script src="js/galleryForms.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/render3D.js"></script>
</body>
</html>
